<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>地球ライブ壁紙</title>
<style>
:root{color-scheme:dark;--bg:#02030a;--fg:#eef2fb;--dim:#8d96ad}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}
canvas{display:block;width:100%;height:100%}
#ov{position:fixed;left:0;top:0;pointer-events:none}
.tag{position:fixed;left:0;top:0;transform:translate(-50%,-50%);font-size:13px;letter-spacing:.2em;color:var(--fg);padding:3px 10px;border-radius:99px;background:rgba(10,16,34,.45);border:1px solid rgba(160,190,255,.25);pointer-events:none;text-shadow:0 1px 4px #000;white-space:nowrap}
#hud{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px));text-align:center;color:var(--fg);pointer-events:none;text-shadow:0 1px 8px #000}
#clock{font-size:clamp(22px,5vw,36px);font-weight:200;letter-spacing:.08em;font-variant-numeric:tabular-nums}
#sub{font-size:12px;color:var(--dim);margin-top:3px;line-height:1.6}
#season{display:flex;justify-content:center;gap:10px;margin-bottom:8px}
.ch{display:inline-flex;align-items:center;gap:8px;padding:6px 15px 6px 12px;border-radius:99px;background:rgba(10,16,34,.5);border:1px solid rgba(160,190,255,.22);font-size:15px;letter-spacing:.14em;backdrop-filter:blur(6px);box-shadow:0 0 18px rgba(0,0,0,.35)}
.ch svg{color:var(--c);filter:drop-shadow(0 0 4px var(--c))}
.ch small{font-size:11px;color:var(--dim);letter-spacing:.1em}
</style>
</head>
